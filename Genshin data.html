<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        html {
            font-size: 62.5%;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            background-color: black;
            color: white;
        }

        header {
            margin-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 9%;
            background-color: transparent;
            filter: drop-shadow(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 3rem;
            color: #b74b4b;
            font-weight: 800;
            cursor: pointer;
            transition: 0.5s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        nav a {
            font-size: 1.8rem;
            color: white;
            margin-left: 4rem;
            font-weight: 500;
            transition: 0.3s ease;
            border-bottom: 3px solid transparent;
            text-decoration: none;
        }

        nav a:hover,
        nav a.active {
            color: #b74b4b;
        }

        .container {
            max-width: 800px;
            margin: 150px auto;
            background-color: #f4f4f4;
            color: black;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #b74b4b;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(183, 75, 75, 0.5);
        }

        .biodata {
            margin-top: 20px;
        }

        .biodata table {
            width: 100%;
            border-collapse: collapse;
        }

        .biodata th, .biodata td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .biodata th {
            background-color: #b74b4b;
            color: white;
        }

        .biodata td {
            background-color: #fff;
            color: black;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.8rem;
            background-color: black;
            border-radius: 4rem;
            font-size: 1.6rem;
            color: #b74b4b;
            letter-spacing: 0.3rem;
            font-weight: 600;
            border: 2px solid #b74b4b;
            transition: 0.3s ease;
            cursor: pointer;
            margin-top: 20px;
            text-align: center;
            display: block;
        }

        .btn:hover {
            background-color: #b74b4b;
            color: black;
            box-shadow: 0 0 25px #b74b4b;
        }

        @media(max-width:995px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2.4rem;
            }

            .biodata table {
                font-size: 1.4rem;
            }

            .profile img {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Biodata</div>
         <!-- Tambah tombol Home untuk kembali ke Porto.html -->
         <a href="Game.html" class="btn">Home</a>

    </header>

    <div class="container">
        <h1>Genshin Impact</h1>

        <div class="profile">
            <img src="fhoto/Genshin.jpg" alt="Foto Profil">
         
        </div>

        <div class="biodata">
            <table>
                <tr>
                    <th>Informasi</th>
                    <th>Detail Informasi</th>
                </tr>
                <tr>
                    <td>Nama Ingame</td>
                    <td>KyouroZs</td>
                </tr>
                <tr>
                    <td>UId</td>
                    <td>815820636</td>
                </tr>
                <tr>
                    <td>Platform</td>
                    <td>PC/Android</td>
                </tr>
                <tr>
                    <td>Adventure Level</td>
                    <td>59</td>
                </tr>
                <tr>
                    <td>Endgame Content</td>
                    <td>All Clears
                    </td>
                </tr>


            
            </table>
        </div>

       
    </div>

</body>
</html>
