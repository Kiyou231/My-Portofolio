<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }
        
        html {
            font-size: 62.5%;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            background-color: black;
            color: white;
        }

        header {
            margin-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 9%;
            background-color: transparent;
            filter: drop-shadow(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 3rem;
            color: #b74b4b;
            font-weight: 800;
            cursor: pointer;
            transition: 0.5s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.8rem;
            background-color: black;
            border-radius: 4rem;
            font-size: 1.6rem;
            color: #b74b4b;
            letter-spacing: 0.3rem;
            font-weight: 600;
            border: 2px solid #b74b4b;
            transition: 0.3s ease;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #b74b4b;
            color: black;
            box-shadow: 0 0 25px #b74b4b;
        }

        .container {
            max-width: 800px;
            margin: 150px auto;
            background-color: #f4f4f4;
            color: black;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #b74b4b;
        }

        .game-info {
            margin-top: 20px;
        }

        .game-info p {
            margin: 5px 0;
        }

        @media(max-width:995px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Valorant</div>
        <a href="Game.html" class="btn">Home</a>
    </header>

    <div class="container">
        <h1>Valorant</h1>
        <div class="game-info">
            <p><strong>Name In Game:</strong> KyouroX #1710</p>
            <p><strong>Rank:</strong> Platinum</p>
            <p><strong>Platform:</strong> PC</p>
        </div>
    </div>

</body>
</html>
